mode: dev
adapter: synthetic
data_root: ../tests/fixtures/synthetic_business/data
rulebook: ../tests/fixtures/synthetic_business/rulebook.md
calendar: ../tests/fixtures/synthetic_business/calendar.csv
questions: ../tests/fixtures/synthetic_business/questions.jsonl
output_root: ../outputs
seed: 7
models:
  backend: disabled
  planner_endpoint: http://127.0.0.1:8001/v1/chat/completions
  reasoner_endpoint: http://127.0.0.1:8000/v1/chat/completions
  planner_model: Qwen/Qwen3.5-4B
  reasoner_model: Qwen/Qwen3.5-9B
  planner_revision: null
