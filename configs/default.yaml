  query_timeout_seconds: 10
  max_wallclock_seconds: 60
  max_model_calls: 6
  max_candidates: 4
  max_repairs: 1
  max_result_rows: 10000
  max_result_bytes: 2000000
  memory_mb: 512
  max_source_bytes: 200000000
  max_source_files: 200
official:
  rules_verified: false
  validator_path: null
  parameter_cap: null
  checkpoint_audit: null
  scoring_verified: false
